<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="95%">
      <stop offset="0" stop-color="#2f8152"/>
      <stop offset=".6" stop-color="#1d5c3a"/>
      <stop offset="1" stop-color="#0f3a23"/>
    </radialGradient>
    <radialGradient id="green" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#7cc276"/>
      <stop offset="1" stop-color="#4e9a55"/>
    </radialGradient>
    <linearGradient id="flag" x1="0" x2="1">
      <stop offset="0" stop-color="#f4c93a"/>
      <stop offset="1" stop-color="#e3a91b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#bg)"/>
  <!-- rolling fairway bands -->
  <path d="M0 360 C120 320 260 330 512 290 L512 512 L0 512 Z" fill="#164a2e" opacity=".75"/>
  <path d="M0 410 C150 380 330 400 512 360 L512 512 L0 512 Z" fill="#103d26" opacity=".85"/>
  <!-- putting green -->
  <ellipse cx="262" cy="388" rx="170" ry="52" fill="url(#green)"/>
  <ellipse cx="262" cy="388" rx="170" ry="52" fill="none" stroke="#a6d89c" stroke-width="4" opacity=".6"/>
  <!-- cup -->
  <ellipse cx="290" cy="392" rx="20" ry="7" fill="#0b2416"/>
  <!-- pin -->
  <rect x="285" y="112" width="9" height="282" rx="4" fill="#f6f1e4"/>
  <!-- flag -->
  <path d="M294 116 L420 156 Q430 160 420 165 L294 206 Z" fill="url(#flag)"/>
  <path d="M294 116 L420 156 Q430 160 420 165 L294 206 Z" fill="none" stroke="#b8860b" stroke-width="3" opacity=".45"/>
  <!-- ball -->
  <circle cx="196" cy="396" r="21" fill="#ffffff"/>
  <circle cx="190" cy="390" r="3" fill="#d9ded8"/><circle cx="200" cy="388" r="3" fill="#d9ded8"/>
  <circle cx="205" cy="398" r="3" fill="#d9ded8"/><circle cx="193" cy="401" r="3" fill="#d9ded8"/>
  <!-- fall leaves -->
  <g transform="translate(120 150) rotate(-25)">
    <path d="M0 -44 L7 -27 L14 -31 L12 -15 L28 -26 L25 -14 L40 -14 L31 -2 L38 4 L18 10 L22 18 L4 14 L3 30 L0 30 L-3 30 L-4 14 L-22 18 L-18 10 L-38 4 L-31 -2 L-40 -14 L-25 -14 L-28 -26 L-12 -15 L-14 -31 L-7 -27 Z" stroke-linejoin="round" stroke-width="3" fill="#e2632b" stroke="#e2632b"/>
    <path d="M0 -20 L0 44" stroke="#9c3d14" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(408 262) rotate(30) scale(.62)">
    <path d="M0 -44 L7 -27 L14 -31 L12 -15 L28 -26 L25 -14 L40 -14 L31 -2 L38 4 L18 10 L22 18 L4 14 L3 30 L0 30 L-3 30 L-4 14 L-22 18 L-18 10 L-38 4 L-31 -2 L-40 -14 L-25 -14 L-28 -26 L-12 -15 L-14 -31 L-7 -27 Z" stroke-linejoin="round" stroke-width="3" fill="#f2a33a" stroke="#f2a33a"/>
    <path d="M0 -20 L0 44" stroke="#a5611a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
