<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fall Classic">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fairview Farm Fall Classic</title>
<link rel="icon" type="image/svg+xml" href="images/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column mobile app; leaderboard-board header, scorecard-style rows below */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece4; --line:#d3dacd;
  --fg:#18231c; --muted:#5a6a5f;
  --green:#1d5c3a; --green-ink:#ffffff; --green-soft:#dcebdf;
  --flag:#e3b51b; --flag-ink:#2a2200;
  --ladies:#8a3a6a; --ladies-soft:#f2e1ea;
  --danger:#b3261e; --mk:rgba(60,80,66,.45);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18201a; --sunk:#1f2a22; --line:#2e3b31;
  --fg:#e7eee8; --muted:#97a69b;
  --green:#3f9a67; --green-ink:#06140b; --green-soft:#1d3426;
  --flag:#f0c63a; --flag-ink:#1c1600;
  --ladies:#d986b6; --ladies-soft:#3a2231;
  --danger:#ff8a80; --mk:rgba(190,205,194,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18201a; --sunk:#1f2a22; --line:#2e3b31;
  --fg:#e7eee8; --muted:#97a69b;
  --green:#3f9a67; --green-ink:#06140b; --green-soft:#1d3426;
  --flag:#f0c63a; --flag-ink:#1c1600;
  --ladies:#d986b6; --ladies-soft:#3a2231;
  --danger:#ff8a80; --mk:rgba(190,205,194,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--green-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.navbtn{background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;cursor:pointer;color:inherit}
#navBoard,.navbtn[aria-pressed="true"]{background:var(--flag);color:var(--flag-ink);border-color:var(--flag)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:44px;font-weight:700}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:600}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}

.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rules li:first-child{border-top:0}
.rules li::before{content:counter(r);font-family:var(--display);font-weight:700;font-size:20px;color:var(--green);line-height:1.3}
.rules li span{min-width:0;overflow-wrap:anywhere}
.note{font-size:14px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);
  padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.big{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:24px;font-weight:700;padding:14px 20px;width:100%}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:10px;font-family:var(--display);font-weight:700;font-size:19px;
  text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.team{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.team:hover{border-color:var(--green)}
.team.mine{border-color:var(--flag);box-shadow:0 0 0 2px var(--flag)}
.team-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--green-soft)}
.team.ladies .team-head{background:var(--ladies-soft)}
.team-head h3{min-width:0;overflow-wrap:anywhere}
.roster{list-style:none;margin:0;padding:4px 14px 10px}
.roster li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.roster li:first-child{border-top:0}
.roster .name{min-width:0;overflow-wrap:anywhere}
.roster .hcp{font-weight:700}
.roster .open{color:var(--muted);font-style:italic}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--green);color:var(--green-ink);white-space:nowrap}
.chip.ladies{background:var(--ladies);color:var(--surface)}
.chip.flag{background:var(--flag);color:var(--flag-ink)}

.card-table{width:100%;border-collapse:collapse}
.card-table th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--fg)}
.card-table td{padding:10px 8px;border-bottom:1px solid var(--line)}
.card-table td.r,.card-table th.r{text-align:right}

.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
.field textarea{min-height:200px;resize:vertical;line-height:1.5}
.field.wide{grid-column:1/-1}
.row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist .who{min-width:0}
.plist .who b{display:block;overflow-wrap:anywhere}
.plist .who small{color:var(--muted)}

.admin-team{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.admin-team .team-head{align-items:center}
.admin-team .body{padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.admin-team .members{list-style:none;margin:0;padding:0}
.admin-team .members li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.admin-team .members li:first-child{border-top:0}
.addrow{display:flex;gap:8px}
.addrow select{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px;min-height:40px}

details.course summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
details.course summary::-webkit-details-marker{display:none}
details.course summary>div{display:flex;flex-direction:column;gap:2px;min-width:0}
details.course .chev{font-size:20px;color:var(--muted);transition:transform .15s}
details.course[open] .chev{transform:rotate(180deg)}
details.course:not([open]){gap:0}
.sc td,.sc th{padding:7px 6px;font-size:15px}
.sc tr.tot td{background:var(--sunk);font-weight:700;border-bottom:1px solid var(--line)}
.edit input{width:64px;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:6px;min-height:38px;text-align:center}
.edit td{padding:5px 6px}
.th-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.tee{font-size:14px;font-weight:600;color:var(--muted)}
.teebig{font-size:18px;color:var(--muted)}
.teebig b{color:var(--fg);font-family:var(--display);font-size:26px;letter-spacing:.02em}
.team-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.topar{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto}
.topar b{font-family:var(--display);font-size:52px;line-height:.9;color:var(--green)}
.topar.idle b{color:var(--muted)}
.topar span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.who-chip{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.who-chip b{overflow-wrap:anywhere}
.who-chip span{font-size:13px;color:var(--muted)}
.who-chip[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--green-ink)}
.who-chip[aria-pressed="true"] span{color:inherit;opacity:.85}
.hs-row{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.hs{border:1.5px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 0;font-weight:700;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0}
.hs.done{background:var(--green-soft);border-color:var(--green-soft)}
.hs.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hole-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hole-facts{display:flex;gap:16px}
.hole-facts small{font-size:inherit}
.hole-facts span{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hole-facts b{font-family:var(--display);font-size:30px;line-height:1;color:var(--fg);letter-spacing:0}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sunk);border-radius:12px;padding:12px 8px}
.stepper .lbl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stepper .sub{font-size:14px;font-weight:600;color:var(--muted)}
.sp{display:flex;align-items:center;gap:6px}
.sp button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:26px;font-weight:600;cursor:pointer;line-height:1}
.sp output{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;min-width:58px;text-align:center}
.sp output.under{color:var(--green)}
.sp output.over{color:var(--danger)}
.hole-team{list-style:none;margin:0;padding:0}
.hole-team li{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:7px 8px;border-top:1px solid var(--line);border-radius:6px}
.hole-team li:first-child{border-top:0}
.hole-team li.counts{background:var(--green-soft)}
.hole-team small{color:var(--muted)}
.dots{color:var(--green);font-size:12px;vertical-align:super;margin-left:1px;letter-spacing:-1px}
.dots.minus{color:var(--danger);letter-spacing:0}
.scroll{overflow-x:auto;max-width:100%}
.grid{border-collapse:collapse;width:100%;font-size:15px}
.grid th,.grid td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);min-width:30px}
.grid thead th{font-size:12px;color:var(--muted);border-bottom:2px solid var(--fg)}
.grid th[scope=row]{text-align:left;padding-left:2px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.grid tr.par td,.grid tr.par th{color:var(--muted)}
.grid td.cnt{background:var(--green-soft);font-weight:700}
.grid .sum{font-weight:700;background:var(--sunk)}
.grid tr.team-row th,.grid tr.team-row td{font-weight:700;border-top:2px solid var(--fg)}
.netsup{font-size:.62em;font-weight:600;color:var(--muted);margin-left:1px;vertical-align:super;line-height:0}
.grid td.cnt .netsup{color:var(--green)}
.p1{color:var(--green)}.p2{color:var(--fg)}.p3{color:var(--danger)}
.putt-grid td.p1,.putt-grid td.p3{font-weight:700}
.sp output.p1{color:var(--green)}.sp output.p3{color:var(--danger)}
.putts{list-style:none;margin:0;padding:0}
.putts li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.putts li:first-child{border-top:0}
.lb-grid{display:grid;grid-template-columns:26px minmax(0,1fr) 68px 48px 64px;gap:10px;align-items:center;padding:10px 6px}
.lb-head{font-size:11px;font-weight:700;letter-spacing:.03em;line-height:1.2;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--fg);padding-block:6px}
.lb-grid .r{text-align:right}
.lb-row{border-bottom:1px solid var(--line)}
.lb-row summary{list-style:none;cursor:pointer}
.lb-row summary::-webkit-details-marker{display:none}
.lb-row .tn{font-weight:600;overflow-wrap:anywhere;display:flex;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.sc-toggle{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green);white-space:nowrap}
.lb-row .when-open{display:none}
.lb-row[open] .when-open{display:inline}
.lb-row[open] .when-closed{display:none}
.lb-row .chev{color:var(--muted);font-size:14px;transition:transform .15s}
.lb-row[open] .chev{transform:rotate(180deg)}
.lb-row.mine>summary{background:var(--green-soft);border-radius:6px}
.lb-body{padding:4px 0 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:400px){.lb-grid{grid-template-columns:22px minmax(0,1fr) 54px 42px 54px;gap:8px;font-size:15px}}
.board td.tn{font-weight:600;overflow-wrap:anywhere}
.board tr.mine td{background:var(--green-soft)}
.sp output.blank{color:var(--muted);opacity:.6}
.prow.todo{border-color:transparent}
.prow.ready{border-color:var(--green);border-style:solid;box-shadow:inset 0 0 0 1px var(--green)}
.hs.part{border-color:var(--flag)}
.prows{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:8px 10px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px;border:1.5px solid transparent}
.prow.counts{background:var(--green-soft)}
.pname{display:flex;flex-direction:column;min-width:0}
.pname b{overflow-wrap:anywhere}
.pname span{font-size:13px;color:var(--muted)}
.pname span b{color:var(--fg)}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px}
.mini .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sp.sm{gap:2px}
.sp.sm button{width:36px;height:36px;font-size:20px}
.sp.sm output{font-size:34px;min-width:34px}
.prow{column-gap:22px}
.prow .mini+.mini{border-left:2px solid var(--line);padding-left:20px}
.prow .mini .lbl{margin-bottom:2px}
.sc-cap{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-6px}
.sc-cap b{color:var(--green)}
.hole-sum{font-weight:600;color:var(--muted)}
.hole-sum b{color:var(--fg);font-size:18px}
.prow{grid-template-columns:1fr 1fr}
.pname{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.pname b{font-size:18px;overflow-wrap:normal;word-break:normal}
.prow .mini{justify-self:center}
@media (min-width:640px){.prow{grid-template-columns:minmax(0,1fr) auto auto}.pname{grid-column:auto;flex-direction:column;gap:0}}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none!important}
.modal-back{position:absolute;inset:0;background:rgba(6,14,9,.55)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:760px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:30px}
.xbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;flex:0 0 auto}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;max-height:88%}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sheetUp .22s ease-out}}
@keyframes sheetUp{from{transform:translateY(24px)}to{transform:none}}
.game-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game-list div{display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-radius:8px;padding:12px;min-width:0}
.game-list b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.game-list span{font-size:15px;color:var(--muted)}
@media (max-width:420px){.game-list{grid-template-columns:1fr}}
.btn.big.oneline{white-space:nowrap;background:var(--flag);color:var(--flag-ink);border-color:var(--flag);border-radius:999px;box-shadow:0 4px 14px rgba(227,181,27,.45),0 2px 0 rgba(0,0,0,.12);font-size:26px;letter-spacing:.06em}
.btn.big.oneline:hover{filter:brightness(1.06);border-color:var(--flag)}

.mem-actions{display:flex;gap:6px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.navrow.end{justify-content:flex-end}
.back.fwd{align-self:auto}
/* leaderboard: give the team name more room */
.lb-grid{grid-template-columns:18px minmax(0,1fr) 50px 36px 50px;gap:8px;padding-left:4px;padding-right:4px}
.lb-head span.r{white-space:normal;line-height:1.1}
.lb-row .tn{font-size:16px;line-height:1.25}
.lb-row .sc-toggle{font-size:11px}
@media (max-width:400px){.lb-grid{grid-template-columns:16px minmax(0,1fr) 44px 32px 44px;gap:6px}}
/* hole header: when the browser can trim text to cap height, make the par/yds/hcp block
   exactly as tall as "HOLE N" so tops and bottoms both line up (sized in JS by fitHoleFacts) */
@supports (text-box: trim-both cap alphabetic){
  .hole-head.trim{align-items:flex-end;row-gap:12px;padding-bottom:8px}
  .hole-head.trim h2{text-box:trim-both cap alphabetic;line-height:1}
  .hole-head.trim .hole-facts span{text-box:trim-both cap alphabetic;line-height:1;display:inline-flex;flex-direction:column;align-items:center;gap:var(--fgap,7px);vertical-align:bottom}
  .hole-head.trim .hole-facts b{text-box:trim-both cap alphabetic;line-height:1}
  .hole-head.trim .hole-facts small{display:block;text-box:trim-both cap alphabetic;line-height:1;font-size:inherit}
  .hole-head.trim .hole-facts{display:flex;gap:14px;align-items:flex-end}
}
/* trash can with a little hanging "TRASH" sign */
.trashcan{position:relative;display:inline-block;width:20px;height:20px;vertical-align:middle;margin-right:2px}
.trashcan .can{font-size:19px;line-height:20px;display:block;text-align:center}
.trashcan .tsign{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-8deg);
  font-family:var(--body);font-size:5.5px;font-weight:900;letter-spacing:.02em;line-height:1;
  background:#fff7d6;color:#1b1b1b;border:1px solid #1b1b1b;border-radius:1.5px;padding:1px 1.5px;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.trashcan .tsign::before{content:"";position:absolute;left:50%;top:-3px;width:5px;height:3px;transform:translateX(-50%);
  border:1px solid #1b1b1b;border-bottom:0;border-radius:3px 3px 0 0}
.chatbtn>span:first-child{font-size:inherit}
@media (max-width:400px){ .trashcan{width:18px;height:18px} .trashcan .can{font-size:17px;line-height:18px} .trashcan .tsign{font-size:5px} }
/* team names stay on one line (font shrinks to fit) */
.fit1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.team-top>div:first-child{flex:1;min-width:0}
.lb-row .tn{flex-direction:column;align-items:stretch;gap:1px;min-width:0}
.lb-row .tn-name{font-weight:700}
.lb-row .sc-toggle{align-self:flex-start}
.sc-cap b.n{color:var(--fg);font-weight:800}
.shuffle-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.lb-row .sc-toggle{display:inline-flex;align-items:center;margin-top:5px;padding:5px 11px;border:1.5px solid var(--green);border-radius:999px;background:var(--surface);color:var(--green);font-size:11px;line-height:1;box-shadow:0 2px 0 var(--green);transition:transform .08s,box-shadow .08s}
.lb-row summary:active .sc-toggle{transform:translateY(2px);box-shadow:0 0 0 var(--green)}
.lb-row[open] .sc-toggle{background:var(--green);color:var(--surface)}
</style>
</head>
<body>

<section id="welcome" hidden></section>
<header class="bar">
  <div class="bar-in">
    <button class="brand" id="brand" type="button">Tournament</button>
    <button class="navbtn" id="navBoard" type="button" aria-pressed="false"><span class="bolt" aria-hidden="true">⚡</span> Live Leaderboard</button>
    <button class="navbtn" id="navRules" type="button" aria-pressed="false">Rules</button>
    <button class="navbtn chatbtn" id="navChat" type="button" aria-label="Trash Talk chat"><span class="trashcan" aria-hidden="true"><span class="can">🗑️</span><span class="tsign">TRASH</span></span> Talk<span class="dot" id="chatDot" hidden></span></button>
  </div>
</header>
<main id="main"><div class="wrap" id="app">
  <div class="empty"><b>Loading the tournament…</b></div>
</div>
<footer class="foot" id="foot"><button type="button" id="footAdmin">Tournament admin</button><button type="button" id="footSignIn">Admin sign-in</button><button type="button" id="footSignOut">Sign out</button></footer></main>
<div class="modal pick-modal" id="pickModal" hidden>
  <div class="modal-back" data-pact="cancel"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pickTitle" id="pickBody"></div>
</div>
<div class="modal" id="chatModal" hidden>
  <div class="modal-back" data-mact="close"></div>
  <div class="sheet chat-sheet" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
    <div class="sheet-head"><h2 id="chatTitle">💬 Trash Talk</h2><div class="sh-actions"><button class="xbtn sndbtn" id="soundBtn" type="button" data-act="sound" aria-label="Message sound on" aria-pressed="true">🔔</button><button class="xbtn" type="button" data-mact="close" aria-label="Close chat">✕</button></div></div>
    <div class="sheet-body chat-body" id="chatBody"></div>
    <form class="composer" id="chatForm" autocomplete="off">
      <div class="as" id="chatAs"></div>
      <div class="crow"><input id="chatInput" type="text" maxlength="280" placeholder="Say something…" enterkeyhint="send"><button class="btn primary" type="submit" id="chatSend">Send</button></div>
    </form>
  </div>
</div>
<div class="modal" id="rulesModal" hidden>
  <div class="modal-back" data-mact="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <div class="sheet-head"><h2 id="rulesTitle">Rules of Play</h2><button class="xbtn" type="button" data-mact="close" aria-label="Close rules">✕</button></div>
    <div class="sheet-body" id="rulesBody"></div>
  </div>
</div>
<div class="modal" id="lbModal" hidden>
  <div class="modal-back" data-mact="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <div class="sheet-head"><h2 id="lbTitle"><span class="bolt" aria-hidden="true">⚡</span> Live Leaderboard</h2><button class="xbtn" type="button" data-mact="close" aria-label="Close leaderboard">✕</button></div>
    <div class="sheet-body" id="lbBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>

const DEFAULT_EVENT = {"course":"Fairview Farm Golf Course, Harwinton, CT","date":"2026-10-31","format":"","ladiesTee":"Red","menTee":"White","name":"Fairview Farm Fall Classic","rules":"","welcome":""};
const DEFAULT_RULES = [
  "Teams of four golfers play in either the Men's or the Ladies' division.",
  "Handicaps are set by the tournament committee and can't be changed on the course.",
  "One golfer per team keeps live score on this app, hole by hole.",
  "Play ready golf and keep pace with the group ahead."
];
const S = { openTeams:new Set(), players:[], teams:[], scores:{}, event:null, course:null, hole:1, draft:null, boardDiv:null, view:"welcome", div:"men", adminTab:"event", teamId:null, editPlayer:null, armed:null, loaded:{p:false,t:false,e:false} };

const heroSrc=()=>S.hero?.data||"images/hero.jpg", logoSrc=()=>S.logo?.data||"images/logo.gif";
const app=document.getElementById("app");

function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null}}

S.div = ls("myDiv") || "men";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtH=h=>{ if(h===null||h===undefined||h==="") return "TBD"; const n=Number(h); if(isNaN(n)) return "TBD"; return n<0? "+"+(-n) : String(n); };
const teamHcp=id=>teamPlayers(id).some(p=>p.handicap==null||p.handicap==="")?"TBD":fmtH(teamTotal(id));
const divName=d=>d==="ladies"?"Ladies'":"Men's";
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"");
const teamPlayers=id=>S.players.filter(p=>p.teamId===id).sort((a,b)=>(Number(a.handicap)||0)-(Number(b.handicap)||0));
const teamTotal=id=>teamPlayers(id).reduce((s,p)=>s+(Number(p.handicap)||0),0);
const fmtTime=t=>{ if(!t) return ""; const [h,m]=t.split(":").map(Number); if(isNaN(h)) return t; return `${(h%12)||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`; };
const byTee=(a,b)=>(a.teeTime||"99:99").localeCompare(b.teeTime||"99:99")||byName(a,b);
const eventName=()=>{ const n=(S.event?.name||"Fall Classic").trim(); const m=n.match(/(Fall Classic|Classic|Invitational|Open|Championship)$/i); return m?m[1]:n; };

let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
async function write(fn,ok){try{await fn(); if(ok) toast(ok);}catch(e){toast(e?.code==="permission-denied"?"Only the tournament admin can change this.":"Couldn't save. Check your connection and try again.");}}

/* ---------- views ---------- */
function rulesFor(div){
  const ev=S.event||{};
  const raw=(div==="ladies"?ev.rulesLadies:ev.rulesMen)||ev.rules||"";
  const custom=raw.split("\n").map(s=>s.replace(/^\s*[-•*\d.)]+\s*/,"").trim()).filter(Boolean);
  if(custom.length) return {list:custom,custom:true};
  const tee=(div==="ladies"?ev.ladiesTee||"Red":ev.menTee||"White");
  return {list:["Teams of 4 will tee off together.",
    `${divName(div)} division plays from the ${tee} tees.`,
    div==="ladies"
      ? "**Shamble:** all four players tee off, the team picks the best drive, and each player plays her own ball in from there."
      : "Everyone plays their own ball from tee to green.",
    "Record every player's score and number of putts on each hole.",
    "Front 9: the team's **single lowest** net score on each hole counts as the team score.",
    "Back 9: the team's **two lowest** net scores on each hole count as the team score.",
    "Net score is your gross score minus your handicap strokes on that hole.",
    "**Out of bounds** is played as a lateral hazard: drop within **two club lengths** of where the ball crossed the line, with a **one-stroke penalty**.",...DEFAULT_RULES.slice(3)],custom:false};
}
function vHome(){
  const ev=S.event||{}, d=S.div;
  const meta=[ev.date&&`<span>${esc(fmtDate(ev.date))}</span>`, ev.course&&`<span>${esc(ev.course)}</span>`, ev.format&&`<span>${esc(ev.format)}</span>`].filter(Boolean).join("");
  return `
  <div class="navrow"><button class="back" data-act="division" type="button">← Division</button><button class="back fwd" data-act="start" type="button">Continue to teams →</button></div>
  <section class="hero">
    <span class="chip ${d==="ladies"?"ladies":""}" style="align-self:flex-start">${divName(d)} division</span>
    <h1>The Fall Classic</h1>
    ${meta?`<div class="meta">${meta}</div>`:""}
  </section>
  ${ev.welcome?`<p>${esc(ev.welcome)}</p>`:""}
  <section class="panel games">
    <h2>Two games, one round</h2>
    <p>Two games run at the same time during today's round.</p>
    <div class="game-list">
      <div><b>Team Competition</b><span>${d==="ladies"?"Teams of four playing a shamble: everyone tees off, the team picks the best drive, then each player plays her own ball in. Front 9: the team's best net score counts. Back 9: the best 2 net scores count.":"Teams of four, everyone plays their own ball. Front 9: the team's best net score counts. Back 9: the best 2 net scores count."}</span></div>
      <div><b>3-Putt Poker</b><span>Putt everything out (no gimmes) and record every player's putts on each hole. Every 3-putt or worse costs that player $1 to the pot.</span></div>
    </div>
    <div class="auto-card"><span aria-hidden="true">✅</span><b>Just enter scores and putts. The app does the rest!</b></div>
  </section>
  <h2 class="sec-title">Buy In</h2>
  <section class="buyin">
    <div class="bi-item"><b class="num">$10</b><span>Buy-in per player at the start of the round.</span></div>
    <div class="bi-item"><b class="num">+$1</b><span>Per three-putt or worse, added to the pot.</span></div>
  </section>
  ${payoutsPanel(d)}
  <button class="btn primary big oneline" data-act="start" type="button">Continue to teams →</button>`;
}

function payoutsPanel(d){
  const potRow=`<div class="payrow poker"><span class="place">3-Putt Poker pot</span><span class="amt num">$${d==="ladies"?40:40}</span><span class="per">+$1 per three-putt</span></div>`;
  return `  <section class="panel">
    <h2>${divName(d)} Division Payouts</h2>
    ${d==="ladies"?`<div class="payrow"><span class="place">1st place team</span><span class="amt num">+1 🃏</span><span class="per">Each player gets an extra card for 3-Putt Poker</span></div>

    :`<div class="payrow"><span class="place">1st place team</span><span class="amt num">$80</span><span class="per num">$20 per player</span></div>
      <div class="payrow"><span class="place">Most 1-putts</span><span class="amt num">$20</span><span class="per">Individual prize</span></div>

`;

${payoutsPanel(d)}

function handRanks(){
  const H=[["Royal flush","A♠ K♠ Q♠ J♠ 10♠"],["Straight flush","9♥ 8♥ 7♥ 6♥ 5♥"],["Four of a kind","Q♣ Q♦ Q♥ Q♠ 4♦"],["Full house","K♠ K♥ K♦ 7♣ 7♠"],
    ["Flush","A♦ J♦ 8♦ 5♦ 2♦"],["Straight","8♣ 7♦ 6♠ 5♥ 4♣"],["Three of a kind","7♠ 7♥ 7♦ K♣ 2♠"],["Two pair","J♥ J♣ 4♠ 4♦ 9♣"],["One pair","10♠ 10♥ A♦ 6♣ 3♠"],["High card","A♣ J♦ 8♠ 5♥ 3♣"]];
  const card=c=>`<span class="pc ${/[♥♦]/.test(c)?"red":""}">${c}</span>`;
  return `<div class="hands"><div class="eyebrow">Poker hands, best to worst</div>
    <ol class="hand-list">${H.map(([n,cs])=>`<li><span class="hn">${n}</span><span class="cards" aria-label="${n} example">${cs.split(" ").map(card).join("")}</span></li>`).join("")}</ol></div>`;

function vWelcome(){
  const ev=S.event||{};
  const name=eventName();
  const m=name.match(/^(.*?)\s*(Fall Classic|Classic|Invitational|Open|Championship)$/i);

  return `${!S.hero?.off?`<img class="photo" src="${esc(heroSrc())}" alt="" onerror="this.remove()">`:`<div class="scene"></div>${flag}`}

  <div class="content">
    ${!S.logo?.off?`<img class="logo" src="${esc(logoSrc())}" alt="Fairview Farm Golf Course logo">`:`<div class="crest" aria-hidden="true">FF</div>`}
    <div class="w-title">
      ${top?`<span class="k">${esc(top)}</span>`:""}
      <h1>${esc(big)}</h1>
      ${ev.date?`<span class="d">${esc(fmtDate(ev.date))}</span>`:""}
      <span class="d">${fmtTime(ev.startTime||"10:00")} start</span>
    </div>
    <div class="w-bottom">
      <button class="play" type="button" data-act="rules">Play now</button>
      ${isAdmin?`<button class="w-admin" type="button" data-act="admin">Tournament admin</button>`:`<button class="w-admin w-signin" type="button" data-act="signin">Admin sign-in</button>`}
    </div>
  </div>`;
}
function vDivision(){
  const ev=S.event||{};
  return `${!S.hero?.off?`<img class="photo" src="${esc(heroSrc())}" alt="" onerror="this.remove()">`:`<div class="scene"></div>`}

    <div class="w-title"><span class="k">${esc(eventName())}</span><h1 style="font-size:clamp(40px,11vw,64px)">Choose your division</h1></div>
    <div class="w-bottom" style="gap:16px">
      <button class="divbtn" type="button" data-act="pickdiv" data-div="men">Men's<small>${esc((ev.menTee||"White"))} tees</small></button>
      <button class="divbtn" type="button" data-act="pickdiv" data-div="ladies">Ladies'<small>${esc((ev.ladiesTee||"Red"))} tees</small></button>
    </div>
  </div>`;
}
function teeFor(div){const c=S.course;if(!c?.tees?.length)return null;const want=(S.event||{})[div==="ladies"?"ladiesTee":"menTee"]||(div==="ladies"?"Red":"White");return c.tees.find(t=>t.name===want)||c.tees[0];}
function vCourse(div){
  const c=S.course; if(!c?.holes?.length) return "";
  const t=teeFor(div), k=div==="ladies"?"hcpL":"hcpM";

    </table></div>

}

/* ---------- scoring ---------- */
const hole=n=>S.course?.holes?.[n-1];
const hcpKey=div=>div==="ladies"?"hcpL":"hcpM";
function strokes(p,n){
  const H=Math.round(Number(p.handicap)||0), hh=hole(n); if(!hh) return 0;
  const idx=Number(hh[hcpKey(p.division)])||18;
  if(H>=0) return Math.floor(H/18)+((idx<=H%18)?1:0);
  const a=Math.min(18,-H); return idx>18-a?-1:0;
}
const entry=(pid,n)=>{const e=S.scores[pid]?.h?.[n]; return e&&e.s?e:null;};
const net=(p,n)=>{const e=entry(p.id,n); return e?e.s-strokes(p,n):null;};
const counts=n=>n<=9?1:2;
function teamHole(t,n){
  const ps=teamPlayers(t.id); if(!ps.length) return null;
  const nets=ps.map(p=>({id:p.id,v:net(p,n)}));
  if(nets.some(x=>x.v===null)) return null;
  const k=Math.min(counts(n),ps.length);
  const best=[...nets].sort((a,b)=>a.v-b.v).slice(0,k);
  const par=(hole(n)?.par||0)*k;
  return {score:best.reduce((s,x)=>s+x.v,0),par,ids:best.map(x=>x.id)};
}
function teamTotals(t){
  let thru=0,score=0,par=0,front=0,frontPar=0,back=0,backPar=0,last=0;
  for(let n=1;n<=18;n++){const h=teamHole(t,n); if(!h) continue; thru++; last=n; score+=h.score; par+=h.par;
    if(n<=9){front+=h.score;frontPar+=h.par}else{back+=h.score;backPar+=h.par}}
  return {thru,score,par,toPar:score-par,front,frontPar,back,backPar};
}
const mark=(s,par)=>{const d=s-par;const c=d<=-2?"eg":d===-1?"bd":d===0?"":d===1?"bg":d===2?"db":"tb";return c?`<span class="mk ${c}">${s}</span>`:`<span class="mk">${s}</span>`;};
const fmtPar=v=>v===0?"E":v>0?"+"+v:"−"+(-v);
function playerStats(p){let g=0,pt=0,n=0;for(let h=1;h<=18;h++){const e=entry(p.id,h);if(e){g+=e.s;pt+=Number(e.p)||0;n++;}}return {gross:g,putts:pt,holes:n};}
const dots=k=>k>0?`<span class="dots" aria-label="${k} stroke${k>1?"s":""}">${"•".repeat(k)}</span>`:k<0?`<span class="dots minus" aria-label="gives back ${-k}">+${-k}</span>`:"";

function vTeam(){
  const t=S.teams.find(x=>x.id===S.teamId);
  if(!t){S.view="choose";return vChoose();}
  const ps=teamPlayers(t.id), tot=teamTotals(t);
  let me=ls("me"); if(!ps.some(p=>p.id===me)) me=null;
  const head=`
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <button class="back" data-act="start" type="button">← All teams</button></div>
  <div class="team-top">
    <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="chip ${t.division==="ladies"?"ladies":""}" style="align-self:flex-start">${divName(t.division)} division</span><h1 class="fit1" data-max="44" data-min="14">${esc(t.name)}</h1>${t.teeTime?`<span class="teebig num">Tee time <b>${fmtTime(t.teeTime)}</b></span>`:""}</div>
    <div class="topar num ${tot.thru?"":"idle"}"><b>${tot.thru?fmtPar(tot.toPar):"–"}</b><span>${tot.thru?`thru ${tot.thru}`:"not started"}</span></div>
  </div>`;
  if(!ps.length) return head+`<div class="empty"><b>No golfers on this team yet</b><span>The tournament admin adds golfers to teams.</span></div>`;
  if(!S.course?.holes?.length) return head+`<div class="empty"><b>The course isn't loaded yet</b></div>`;
  const who_unused=`<section class="panel"><h2>Who's entering scores?</h2>
    <div class="who-row">${ps.map(p=>`<button type="button" class="who-chip" data-act="me" data-id="${esc(p.id)}" aria-pressed="${me===p.id}"><b>${esc(p.name)}</b><span class="num">HCP ${fmtH(p.handicap)}</span></button>`).join("")}</div>
    ${me?"":`<p class="note">Tap your name. Each golfer enters their own score and putts.</p>`}</section>`;
  return head+vEntry(t,ps)+vTeamCard(t,ps);
}
function vEntry(t,ps){
  const n=S.hole, h=hole(n);
  if(!S.draft||S.draft.tid!==t.id||S.draft.n!==n){
    const v={}; ps.forEach(p=>{const e=entry(p.id,n);v[p.id]={s:e?.s??null,p:e?.p??null,had:!!e};});
    S.draft={tid:t.id,n,v,startedEmpty:!ps.every(p=>entry(p.id,n))};
  }
  const v=S.draft.v; ps.forEach(p=>{if(!v[p.id])v[p.id]={s:null,p:null,had:false};});
  const ready=ps.every(p=>v[p.id].s!=null&&v[p.id].p!=null);
  const allIn=ps.every(p=>entry(p.id,n));
  // Another phone on this team saved this hole while we were on it: tell this phone and offer the next hole
  const hkey=t.id+":"+n;
  if(S.draft.startedEmpty&&allIn&&!(S.savedHere||{})[hkey]&&!(S.ackHole||{})[hkey]){
    const strip0=Array.from({length:18},(_,i)=>{const m=i+1;const done=ps.every(p=>entry(p.id,m));return `<button type="button" class="hs ${m===n?"cur":""} ${done?"done":""}" data-act="hole" data-n="${m}">${m}</button>`}).join("");
    return `<section class="panel entry">
      <div class="hs-row" role="group" aria-label="Holes">${strip0}</div>
      <div class="taken" role="alert">
        <div class="taken-ic" aria-hidden="true">✅</div>
        <h2>Hole ${n} is already in</h2>
        <p>Someone else on your team already entered scores for hole ${n}.${n<18?` Head on to hole ${n+1}.`:""}</p>
        <div class="taken-actions">
          ${n<18?`<button class="btn primary big-ish" type="button" data-act="hole" data-n="${n+1}">Go to hole ${n+1}</button>`:""}
          <button class="btn" type="button" data-act="ackhole">Review or edit hole ${n}</button>
        </div>
      </div>
    </section>`;
  }
  // live preview of team score using draft values
  const k=Math.min(counts(n),ps.length);
  const nets=ps.filter(p=>v[p.id].s!=null).map(p=>({id:p.id,v:v[p.id].s-strokes(p,n)})).sort((a,b)=>a.v-b.v);
  const full=nets.length===ps.length;
  const best=full?nets.slice(0,k):[], cntIds=best.map(x=>x.id), tscore=best.reduce((a,x)=>a+x.v,0);
  const strip=Array.from({length:18},(_,i)=>{const m=i+1;const done=ps.every(p=>entry(p.id,m));const part=!done&&ps.some(p=>entry(p.id,m));
    return `<button type="button" class="hs ${m===n?"cur":""} ${done?"done":part?"part":""}" data-act="hole" data-n="${m}" aria-label="Hole ${m}${done?", entered":""}">${m}</button>`}).join("");
  const rows=ps.map(p=>{const d=v[p.id], kk=strokes(p,n), nv=d.s==null?"–":d.s-kk, pid=esc(p.id);
    return `<div class="prow ${cntIds.includes(p.id)?"counts":""} ${d.s==null||d.p==null?"todo":"ready"}">
      <div class="pname"><b>${esc(p.name)}</b><span class="num">${dots(kk)}${kk?` ${kk>0?kk+" stroke"+(kk>1?"s":""):"gives "+(-kk)}`:"no stroke"} · net <b>${nv}</b></span></div>
      <div class="mini"><span class="lbl">Score</span><div class="sp sm"><button type="button" data-act="adj" data-id="${pid}" data-f="s" data-d="-1" aria-label="${esc(p.name)} score down">−</button><output class="num ${d.s==null?"blank":d.s<h.par?"under":d.s>h.par?"over":""}">${d.s??"–"}</output><button type="button" data-act="adj" data-id="${pid}" data-f="s" data-d="1" aria-label="${esc(p.name)} score up">+</button></div></div>
      <div class="mini"><span class="lbl">Putts</span><div class="sp sm"><button type="button" data-act="adj" data-id="${pid}" data-f="p" data-d="-1" aria-label="${esc(p.name)} putts down">−</button><output class="num ${d.p==null?"blank":d.p<=1?"p1":d.p===2?"p2":"p3"}">${d.p??"–"}</output><button type="button" data-act="adj" data-id="${pid}" data-f="p" data-d="1" aria-label="${esc(p.name)} putts up">+</button></div></div>
    </div>`}).join("");
  return `<section class="panel entry">
    <div class="hs-row" role="group" aria-label="Holes">${strip}</div>
    <div class="hole-head">
      <div><span class="eyebrow">${n<=9?"Front 9 · best net score":"Back 9 · best 2 net scores"}</span><h2 style="font-size:40px">Hole ${n}</h2></div>
      <div class="hole-facts num"><span><b>${h.par}</b><small>Par</small></span><span><b>${teeFor(t.division)?.yards?.[n-1]??"–"}</b><small>Yds</small></span><span><b>${h[hcpKey(t.division)]??"–"}</b><small>HCP</small></span></div>
    </div>
    <div class="prows">${rows}</div>
    <div class="hole-sum num">${full?`Team on this hole: <b>${tscore}</b> net (${fmtPar(tscore-h.par*k)})`:`Tap + or − to enter each golfer's score and putts. The first tap sets par for score and 2 for putts.`}</div>
    <div class="row-actions save-bar">
      ${allIn?`<button class="btn" type="button" data-act="clearhole">Clear hole</button>`:""}
      <button class="btn primary" type="button" data-act="savehole" style="flex:1" ${ready?"":"disabled"}>${ready?`${allIn?"Update":"Save"} scores${n<18?" & go to next hole":""}`:`Enter all scores and putts`}</button>
    </div>
  </section>`;
}
function vTeamCard(t,ps,bare){
  const c=S.course, rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
  const half=(a,b,lbl)=>{
    const hs=rng(a,b);
    const pr=hs.reduce((x,n)=>x+hole(n).par,0);
    const prow=p=>{let g=0,all=true;const cells=hs.map(n=>{const e=entry(p.id,n);const th=teamHole(t,n);const cnt=th&&th.ids.includes(p.id);if(e)g+=e.s;else all=false;
      return `<td class="${cnt?"cnt":""}">${e?`${mark(e.s,hole(n).par)}<sup class="netsup" aria-label="net ${e.s-strokes(p,n)}">${e.s-strokes(p,n)}</sup>`:""}</td>`}).join("");
      return `<tr><th scope="row">${esc(p.name.split(" ")[0])}</th>${cells}<td class="sum">${g||""}</td></tr>`;};
    let ts=0;const tcells=hs.map(n=>{const th=teamHole(t,n);if(th)ts+=th.score;return `<td>${th?th.score:""}</td>`}).join("");
    return `<div class="scroll"><table class="grid num"><thead><tr><th>${lbl}</th>${hs.map(n=>`<th>${n}</th>`).join("")}<th class="sum">Tot</th></tr></thead>
      <tbody><tr class="par"><th scope="row">Par</th>${hs.map(n=>`<td>${hole(n).par}</td>`).join("")}<td class="sum">${pr}</td></tr>
      ${ps.map(prow).join("")}
      <tr class="team-row"><th scope="row">Team</th>${tcells}<td class="sum">${ts||""}</td></tr></tbody></table></div>`;
  };
  const pc=v=>v==null?"":v<=1?"p1":v===2?"p2":"p3";
  const puttHalf=(a,b,lbl)=>{const hs=rng(a,b);
    const prow=p=>{let tot=0;const cells=hs.map(n=>{const e=entry(p.id,n);const v=e?Number(e.p):null;if(v!=null&&!isNaN(v))tot+=v;return `<td class="${pc(v)}">${v??""}</td>`}).join("");
      return `<tr><th scope="row">${esc(p.name.split(" ")[0])}</th>${cells}<td class="sum">${tot||""}</td></tr>`;};
    return `<div class="scroll"><table class="grid num putt-grid"><thead><tr><th>${lbl}</th>${hs.map(n=>`<th>${n}</th>`).join("")}<th class="sum">Tot</th></tr></thead><tbody>${ps.map(prow).join("")}</tbody></table></div>`;};
  const pcount=p=>{let one=0,three=0;for(let n=1;n<=18;n++){const e=entry(p.id,n);if(!e)continue;const v=Number(e.p);if(v===1)one++;else if(v>=3)three++;}return {one,three};};
  const putts=`<table class="card-table num"><thead><tr><th>Golfer</th><th class="r">1-putts</th><th class="r">3+ putts</th></tr></thead><tbody>${ps.map(p=>{const c=pcount(p);return `<tr><td>${esc(p.name)}</td><td class="r p1"><b>${c.one}</b></td><td class="r p3"><b>${c.three}</b></td></tr>`}).join("")}</tbody></table>`;
  const inner=`<div class="sc-cap"><b>Front 9</b> · Best <b class="n">1</b> net score</div>${half(1,9,"Out")}<div class="sc-cap"><b>Back 9</b> · Best <b class="n">2</b> net scores</div>${half(10,18,"In")}`;
  if(bare) return inner;
  return `<section class="panel"><h2>Team scorecard</h2>${inner}<h3>Putts</h3>${putts}</section>

}

    <thead><tr><th>Golfer</th><th class="r">1-putts</th><th class="r">3+</th><th class="r">Owed</th><th class="r">Putts</th></tr></thead>

}

let actx=null;

function noiseBuf(a,secs){ const b=a.createBuffer(1,Math.ceil(a.sampleRate*secs),a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }

  c.buffer=ir; const dry=a.createGain(), w=a.createGain(), inp=a.createGain(); dry.gain.value=1; w.gain.value=wet;
  inp.connect(dry); dry.connect(dest); inp.connect(c); c.connect(w); w.connect(dest); return inp; }

function shoutouts(D){
  const out=[], h=hole(D.n);
  for(const [pid,d] of Object.entries(D.v)){
    const p=S.players.find(q=>q.id===pid); if(!p) continue;
    const prev=entry(pid,D.n);
    if(prev&&prev.s===d.s&&prev.p===d.p) continue;
    const diff=d.s-h.par;
    if(d.s===1) out.push({t:`🎯 HOLE IN ONE! ${p.name} aced #${D.n}!`,snd:"ace"});

}

  if(b.dataset.pact==="confirm"){ const id=b.dataset.id; closePick(); S.teamId=id; ls("myTeam",id); S.hole=firstOpen(id); S.draft=null; toast("Let's go! Good luck out there."); go("team"); }
});

  if(a==="chatdel"){const id=b.dataset.id; if(S.armed!=="m"+id){S.armed="m"+id;return renderChat();} S.armed=null;

app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="home") return go("home");
  if(act==="welcome") return go("welcome");
  if(act==="division") return go("division");
  if(act==="testheckle"){ unlockAudio(); const was=ls("chatSound"); ls("chatSound","on"); playSfx("boo"); if(was) ls("chatSound",was); return; }
  if(act==="testace"){ unlockAudio(); const was=ls("chatSound"); ls("chatSound","on"); playSfx("ace"); if(was) ls("chatSound",was); return; }
  if(act==="clearace"){ await write(()=>db.doc("config/ace").delete(),"Back to the crowd cheer"); return; }
  if(act==="clearheckle"){ await write(()=>db.doc("config/heckle").delete(),"Back to the built-in clip"); return; }
  if(act==="clearimg"){ await write(()=>db.doc("config/"+b.dataset.slot).set({off:true}),"Photo removed"); return; }
  if(act==="start") return go("choose");
  if(act==="team") return go("team");
  if(act==="board"){return openBoard();}
  if(act==="bdiv"){S.boardDiv=b.dataset.div;return render();}
  if(act==="hole"){S.hole=Number(b.dataset.n);S.draft=null;return render();}
  if(act==="adj"){const f=b.dataset.f,dd=Number(b.dataset.d);const d=S.draft?.v?.[id]; if(!d) return;
    if(f==="s") d.s = d.s==null ? (hole(S.draft.n)?.par||4) : Math.max(1,Math.min(15,d.s+dd));
    else d.p = d.p==null ? 2 : Math.max(0,Math.min(9,d.p+dd));
    if(d.p!=null&&d.s!=null&&d.p>d.s)d.p=d.s; return render();}
  if(act==="ackhole"){ const D=S.draft; if(D){ (S.ackHole=S.ackHole||{})[D.tid+":"+D.n]=true; } S.draft=null; return render(); }
  if(act==="savehole"){const D=S.draft;if(!D)return; (S.savedHere=S.savedHere||{})[D.tid+":"+D.n]=true;
    if(Object.values(D.v).some(d=>d.s==null||d.p==null)) return toast("Enter every golfer's score and putts first.");
    b.disabled=true;
    const shouts=shoutouts(D);
    try{ for(const [pid,d] of Object.entries(D.v)){ if(!S.players.some(p=>p.id===pid&&p.teamId===D.tid)) continue;
        const ref=db.doc("scores/"+pid);
        await ref.set({h:{[D.n]:{s:d.s,p:d.p}},by:myUid},{merge:true}); }
      for(const x of shouts){ try{ await postChat(x.t,"auto",x.snd); }catch(e){} }
      if(shouts.length){ const top=shouts.reduce((m,x)=>SFX_RANK[x.snd]>SFX_RANK[m.snd]?x:m); playSfx(top.snd); }
      if(shouts.length){ const top=shouts.reduce((m,x)=>SFX_RANK[x.snd]>SFX_RANK[m.snd]?x:m); toast(top.t); } else toast(`Hole ${D.n} saved`);
      if(D.n<18){S.hole=D.n+1;} S.draft=null; render();
      const en=document.querySelector(".entry"); if(en){const y=en.getBoundingClientRect().top+window.scrollY-70; window.scrollTo({top:Math.max(0,y),behavior:"smooth"});} }
    catch(err){ b.disabled=false; toast(err?.code==="permission-denied"?"Couldn't save. Reload the page and try again.":"Couldn't save. Check your connection and try again."); }
    return;}
  if(act==="clearhole"){const D=S.draft;if(!D)return;b.disabled=true;
    await write(async()=>{for(const pid of Object.keys(D.v)) if(S.scores[pid]) await db.doc("scores/"+pid).update({["h."+D.n]:firebase.firestore.FieldValue.delete()});},`Hole ${D.n} cleared`);S.draft=null;render();return;}
  if(act==="div"){S.div=b.dataset.div;ls("myDiv",S.div);return render();}
  if(act==="pick"){ if(S.teamId===id){ S.hole=firstOpen(id);S.draft=null;return go("team"); } return openPick(id); }
  if(act==="leave"){S.teamId=null;ls("myTeam",null);return go("choose");}
  if(act==="import"){
    S.iTest=document.getElementById("iTest")?.checked; S.importing=true; render();
    try{
      const seed=await (await fetch("seed.json",{cache:"no-store"})).json();
      let batch=db.batch(), n=0; const flush=async()=>{await batch.commit(); batch=db.batch(); n=0;};
      const put=async(path,data)=>{batch.set(db.doc(path),data); if(++n>=400) await flush();};
      for(const [id,d] of Object.entries(seed.config)) await put("config/"+id,d);
      for(const [id,d] of Object.entries(seed.players)) await put("players/"+id, S.iTest?d:{...d,teamId:null});
      if(S.iTest){ for(const [id,d] of Object.entries(seed.teams)) await put("teams/"+id,d);
                   for(const [id,d] of Object.entries(seed.scores)) await put("scores/"+id,{...d,by:"seed"}); }
      await flush(); toast("Starting data loaded");
    }catch(err){ toast(err?.code==="permission-denied"?"Only the admin can load data. Check the security rules.":"Couldn't load the data. Try again."); }
    S.importing=false; render(); return;
  }
  if(act==="resetcancel"){S.armed=null;return render();}
  if(act==="reset"){
    const cs=document.getElementById("rScores")?.checked, ct=document.getElementById("rTeams")?.checked, cc=document.getElementById("rChat")?.checked;
    S.rScores=cs; S.rTeams=ct; S.rChat=cc;
    if(!cs&&!ct&&!cc) return toast("Tick at least one thing to clear.");
    if(S.armed!=="reset"){S.armed="reset";return render();}
    S.resetting=true; render();
    try{
      if(cs){ for(const id of Object.keys(S.scores)) await db.doc("scores/"+id).delete(); }
      if(cc){ let snap; do{ snap=await db.collection("chat").limit(200).get(); for(const d of snap.docs) await db.doc("chat/"+d.id).delete(); }while(snap.size===200); }
      if(ct){ for(const p of S.players.filter(p=>p.teamId)) await db.doc("players/"+p.id).update({teamId:null});
              for(const t of [...S.teams]) await db.doc("teams/"+t.id).delete();
              S.teamId=null; ls("myTeam",null); }
      toast([cs&&"Scores",ct&&"teams",cc&&"chat"].filter(Boolean).join(" and ")+" cleared");
    }catch(err){ toast("Reset stopped partway. Tap Reset again to finish."); }
    S.resetting=false; S.armed=null; render(); return;
  }
  if(act==="atab"){S.adminTab=b.dataset.tab;S.editPlayer=null;S.armed=null;return render();}
  if(act==="pedit"){S.editPlayer=id;render();window.scrollTo(0,0);document.getElementById("pName")?.focus();return;}
  if(act==="pcancel"){S.editPlayer=null;document.activeElement?.blur();return render();}
  if(act==="pdel"){ if(S.armed!==id){S.armed=id;return render();} S.armed=null;
    await write(()=>db.doc("players/"+id).delete(),"Golfer deleted"); return; }
  if(act==="tdel"){ if(S.armed!==id){S.armed=id;return render();} S.armed=null;
    await write(async()=>{ for(const p of teamPlayers(id)) await db.doc("players/"+p.id).update({teamId:null}); await db.doc("teams/"+id).delete(); },"Team deleted"); return; }
  if(act==="tedit"){ S.editTeam=id; S.armed=null; render(); const i=document.getElementById("tRename"); if(i){i.focus(); i.select();} return; }
  if(act==="tcancel"){ S.editTeam=null; document.activeElement?.blur(); return render(); }
  if(act==="pedit-go"){ S.adminTab="players"; S.editPlayer=id; S.armed=null; render(); window.scrollTo(0,0); setTimeout(()=>document.getElementById("pName")?.focus(),50); return; }
  if(act==="shufcancel"){ S.armed=null; return render(); }
  if(act==="shuffle"){ const d=b.dataset.div; if(S.armed!=="shuf-"+d){S.armed="shuf-"+d;return render();} S.armed=null;
    const ts=S.teams.filter(t=>t.division===d).sort(byTee);
    const ps=S.players.filter(p=>p.division===d).map(p=>p.id);
    for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ps[i],ps[j]]=[ps[j],ps[i]];}
    // deal round-robin so teams fill evenly, max four each; leftovers stay unassigned
    const assign={}; ps.forEach((pid,i)=>{ const r=Math.floor(i/ts.length); assign[pid]=r<4?ts[i%ts.length].id:null; });
    await write(async()=>{ const bt=db.batch(); for(const pid of ps) bt.set(db.doc("players/"+pid),{teamId:assign[pid]},{merge:true}); await bt.commit(); },
      divName(d)+" teams shuffled"); return; }
  if(act==="tremove"){ await write(()=>db.doc("players/"+id).update({teamId:null}),"Removed from team"); return; }
  if(act==="tadd"){ const s=document.getElementById("add-"+id); const pid=s&&s.value; if(!pid) return toast("Pick a golfer first.");
    if(teamPlayers(id).length>=4) return toast("That team already has four golfers.");
    await write(()=>db.doc("players/"+pid).update({teamId:id}),"Added to team"); return; }
});

app.addEventListener("change",async e=>{
  const inp=e.target;
  if(inp.id==="iTest"){S.iTest=inp.checked;return;}
  if(inp.id==="rScores"||inp.id==="rTeams"||inp.id==="rChat"){S[inp.id]=inp.checked;S.armed=null;render();return;}
  if(inp.id==="pTbd"){const hi=document.getElementById("pHcp"); hi.disabled=inp.checked; if(inp.checked) hi.value=""; else hi.focus(); return;}
  if(inp.type==="time"&&inp.dataset.team){ const id=inp.dataset.team; const val=inp.value||null; inp.blur();
    await write(()=>db.doc("teams/"+id).update({teeTime:val}), val?"Tee time set to "+fmtTime(val):"Tee time cleared"); render(); return; } if(inp.type!=="file"||!inp.dataset.slot||!inp.files[0]) return;
  const f=inp.files[0];
  if(inp.dataset.slot==="heckle"||inp.dataset.slot==="ace"){
    if(f.size>650*1024){ inp.value=""; return toast("That clip is too big. Keep it under 600 KB (a few seconds)."); }
    toast("Uploading…");
    try{ const data=await new Promise((res,rej)=>{const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(f);});
      await db.doc("config/"+inp.dataset.slot).set({data}); toast(inp.dataset.slot==="ace"?"Hole-in-one sound saved":"3-putt sound saved"); }
    catch(err){ toast(err?.code==="permission-denied"?"Only the admin can change sounds.":"Couldn't save that clip. Try an MP3."); }
    inp.value=""; return; }
  if(f.size>20*1024*1024) return toast("That photo is over 20 MB. Pick a smaller one.");
  toast("Uploading…");
  try{ const data=await shrinkImage(f, inp.dataset.slot==="logo"?400:1600);
    await db.doc("config/"+inp.dataset.slot).set({data}); toast("Photo saved"); }
  catch(err){ toast(err?.code==="permission-denied"?"Only the admin can change photos.":"Couldn't use that image. Try a JPG or PNG."); }
  inp.value="";
});
app.addEventListener("toggle",e=>{
  const dt=e.target; if(dt.classList&&dt.classList.contains("lb-row")){const id=dt.dataset.team;
    if(dt.open&&!S.openTeams.has(id)){S.openTeams.add(id);render();} else if(!dt.open&&S.openTeams.has(id)){S.openTeams.delete(id);render();} return;}if(e.target.id==="courseCard")S.courseOpen=e.target.open;},true);
app.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target; const v=id=>document.getElementById(id).value.trim();
  if(f.id==="evForm"){
    const data={name:v("evName"),date:v("evDate"),startTime:v("evStart")||"10:00",course:v("evCourse"),format:v("evFormat"),welcome:v("evWelcome"),rules:"",rulesMen:document.getElementById("evRulesMen").value,rulesLadies:document.getElementById("evRulesLadies").value};
    const mt=document.getElementById("evMenTee"),lt=document.getElementById("evLadiesTee"); if(mt){data.menTee=mt.value;data.ladiesTee=lt.value;}
    document.activeElement?.blur();
    await write(()=>db.doc("config/event").set(data),"Event saved");
  }
  if(f.id==="cForm"){
    const holes=S.course.holes.map((h,i)=>{const n=id=>{const x=document.getElementById(id).value;return x===""?null:Number(x)};return {...h,par:n("cPar"+i),hcpM:n("cHm"+i),hcpL:n("cHl"+i)}});
    document.activeElement?.blur();
    await write(()=>db.doc("config/course").set({...S.course,holes}),"Course saved");
  }
  if(f.id==="pForm"){
    const name=v("pName"); if(!name) return toast("Enter the golfer's name.");
    const tbd=document.getElementById("pTbd")?.checked; const h=v("pHcp");
    if(!tbd&&h==="") return toast("Enter a handicap or tick TBD.");
    const handicap=tbd?null:Math.round(Number(h)*10)/10;
    if(h!==""&&isNaN(handicap)) return toast("Handicap must be a number.");
    const division=v("pDiv"); S.lastDiv=division;
    const ed=S.editPlayer?S.players.find(p=>p.id===S.editPlayer):null;
    document.activeElement?.blur();
    if(ed){
      const team=S.teams.find(t=>t.id===ed.teamId);
      const teamId=team&&team.division===division?ed.teamId:null;
      await write(()=>db.doc("players/"+ed.id).set({name,handicap,division,teamId}),"Golfer saved");
      S.editPlayer=null; render();
    }else{
      await write(()=>db.collection("players").add({name,handicap,division,teamId:null}),name+" added");
      const n=document.getElementById("pName"); if(n){n.value="";const hi=document.getElementById("pHcp");hi.value="";hi.disabled=false;document.getElementById("pTbd").checked=false;n.focus();}
    }
  }
  if(f.id==="tRenameForm"){
    const name=document.getElementById("tRename").value.trim(); if(!name) return toast("Enter a team name.");
    const id=f.dataset.team; document.activeElement?.blur(); S.editTeam=null;
    await write(()=>db.doc("teams/"+id).update({name}),"Team renamed to "+name); render(); return;
  }
  if(f.id==="tForm"){
    const name=v("tName"); if(!name) return toast("Enter a team name.");
    const division=v("tDiv"); S.lastTDiv=division; document.activeElement?.blur();
    const teeTime=v("tTime")||null;
    await write(()=>db.collection("teams").add({name,division,teeTime}),name+" created");
    render();
  }
});

/* ---------- boot ---------- */
render();
(async()=>{
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth();
  db=firebase.firestore();
  const fail=e=>{ console.warn(e); if(e&&e.code==="permission-denied"){ sysBanner("Can't load tournament data. Tournament admin: publish the Firestore security rules (see README)."); } };
  auth.getRedirectResult().catch(()=>{});
  // Load data right away for everyone; sign-in only matters for saving.
  auth.onAuthStateChanged(async u=>{
    if(!u){ try{ await auth.signInAnonymously(); }
      catch(e){ console.warn(e);
        sysBanner(e&&(e.code==="auth/operation-not-allowed"||e.code==="auth/admin-restricted-operation")
          ? "Scores and chat can't be saved yet. Tournament admin: turn on Anonymous sign-in in Firebase → Authentication → Sign-in method."
          : "Couldn't connect to save scores. Check your connection and reload."); }
      return; }
    authUser=u; myUid=u.uid; sysBanner(null);
    const was=isAdmin; isAdmin=!u.isAnonymous && ADMIN_EMAILS.includes((u.email||"").toLowerCase());
    if(!u.isAnonymous&&!isAdmin){ toast("That Google account isn't the tournament admin."); await auth.signOut(); return; }
    if(isAdmin&&!was) toast("Signed in as admin");
    if(!isAdmin&&S.view==="admin") S.view="welcome";
    render();
  });
  let chatFirst=true;
  db.collection("chat").orderBy("at","desc").limit(150).onSnapshot(s=>{
    const prevIds=new Set((S.chat||[]).map(x=>x.id));
    S.chat=s.docs.map(d=>({id:d.id,...d.data()}));
    const seen=ls("chatSeen")||"", me=ls("chatMe");
    const fresh=S.chat.filter(x=>!prevIds.has(x.id)&&!(x.kind!=="auto"&&x.pid===me)&&x.uid!==myUid);
    if(!chatFirst&&fresh.length){ const k=fresh.map(x=>x.kind==="auto"?(x.snd||"ping"):"ping").reduce((m,k)=>(SFX_RANK[k]||1)>(SFX_RANK[m]||1)?k:m,"ping"); playSfx(k); }
    if(S.chatOpen){markSeen();}
    else{
      S.chatUnread=S.chat.some(x=>(x.at||"")>seen&&!(x.kind!=="auto"&&x.pid===me));
      if(!chatFirst&&fresh.length){const x=fresh.sort((a,b)=>(b.at||"").localeCompare(a.at||""))[0];
        const p=S.players.find(q=>q.id===x.pid); toast(x.kind==="auto"?x.t:`💬 ${p?.name||"Someone"}: ${x.t}`);}
    }
    chatFirst=false; renderChat();
  },fail);
  db.collection("scores").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.scores=m;render();},fail);
  db.collection("players").onSnapshot(s=>{S.players=s.docs.map(d=>({id:d.id,...d.data()}));render();},fail);
  db.collection("teams").onSnapshot(s=>{S.teams=s.docs.map(d=>({id:d.id,...d.data()}));render();},fail);
  db.doc("config/course").onSnapshot(s=>{S.course=s.exists?s.data():DEFAULT_COURSE;render();},fail);
  db.doc("config/event").onSnapshot(s=>{S.event=s.exists?s.data():DEFAULT_EVENT;render();},fail);
  db.doc("config/hero").onSnapshot(s=>{S.hero=s.exists?s.data():null;render();},fail);
  db.doc("config/ace").onSnapshot(s=>{S.ace=s.exists?s.data():null; loadAce(S.ace?.data); render();},fail);
  db.doc("config/heckle").onSnapshot(s=>{S.heckle=s.exists?s.data():null; loadHeckle(S.heckle?.data||DEFAULT_HECKLE); render();},fail);
  db.doc("config/logo").onSnapshot(s=>{S.logo=s.exists?s.data():null;render();},fail);
  render();
})();
</script>
